name: Actualizar y publicar

on:
  schedule:
    - cron: '*/30 * * * *'   # cada 30 minutos revisa la hoja
  push:
    branches: [main]          # cuando se sube un cambio de diseño
  workflow_dispatch:          # botón "Run workflow" para forzarlo a mano

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generar páginas de partidos
        run: python3 build/generate.py
      - name: Guardar cambios (solo si la hoja cambió)
        id: guardar
        run: |
          git config user.name "liga-mayor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site
          if git diff --cached --quiet; then
            echo "Sin cambios en la hoja."
            echo "cambio=no" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Actualiza partidos desde la hoja"
            git push
            echo "cambio=si" >> "$GITHUB_OUTPUT"
          fi
      - name: Preparar publicación
        if: steps.guardar.outputs.cambio == 'si' || github.event_name != 'schedule'
        uses: actions/configure-pages@v5
      - name: Subir sitio
        if: steps.guardar.outputs.cambio == 'si' || github.event_name != 'schedule'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publicar en GitHub Pages
        if: steps.guardar.outputs.cambio == 'si' || github.event_name != 'schedule'
        uses: actions/deploy-pages@v4
